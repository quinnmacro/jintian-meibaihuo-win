[package]
name = "jintian-meibaihuo"
version = "0.1.0"
description = "置顶浮动的像素风待办小窗"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["window-all", "fs-readFile", "fs-writeFile"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]